name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Callable from release.yml so a tag push runs the full suite before anything
  # is published. Without this, tagging skipped tests entirely: the triggers
  # above only fire on pushes to main and on pull requests, never on tags.
  workflow_call:



jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          # Glob covers requirements.txt and requirements-dev.txt, so the cache
          # key changes when either moves.
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        working-directory: backend
        # requirements-dev.txt, not requirements.txt: pytest and httpx live there
        # now so the production image doesn't ship a test runner. The dev file
        # includes the runtime one via `-r requirements.txt`.
        run: |
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: pytest tests/ -v



  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npx vitest run



  # Builds the image and smoke-tests the running container. Unit tests cannot
  # catch a broken Dockerfile, and the things this checks — privilege drop, the
  # baked-in version, HEALTHCHECK, the CLI being usable inside the image — only
  # exist at container level. Without this, a Dockerfile mistake would first be
  # discovered while cutting a release.
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: mosaic:ci
          build-args: |
            MOSAIC_BUILD_VERSION=ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          docker run -d --name mosaic-ci \
            -e SECRET_KEY=ci-only-secret-not-used-anywhere-real \
            -e ENV=production \
            -e COOKIE_SECURE=false \
            -e DATA_DIR=/app/data \
            -p 8000:8000 \
            mosaic:ci

      - name: Wait for the container's own HEALTHCHECK to report healthy
        run: |
          for _ in $(seq 1 45); do
            status=$(docker inspect --format='{{.State.Health.Status}}' mosaic-ci)
            echo "health: $status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            if [ "$status" = "unhealthy" ]; then break; fi
            sleep 3
          done
          echo "container never became healthy"
          exit 1

      - name: Health endpoint reports the version baked in at build time
        run: |
          body=$(curl -fsS http://127.0.0.1:8000/api/health)
          echo "$body"
          echo "$body" | grep -q '"version":"ci-test"'
          echo "$body" | grep -q '"status":"ok"'

      - name: The app writes its data as the unprivileged user, not root
        # `docker exec` bypasses the entrypoint and so runs as root — checking
        # `id -u` would prove nothing. The ownership of a file the *application*
        # created is the real evidence that privileges were dropped.
        run: |
          owner=$(docker exec mosaic-ci stat -c %u /app/data/mosaic.db)
          echo "mosaic.db owned by uid $owner"
          test "$owner" = "10001"

      - name: The maintenance CLI works inside the image
        run: docker exec mosaic-ci python -m cli verify

      - name: Container logs (on failure)
        if: failure()
        run: docker logs mosaic-ci
