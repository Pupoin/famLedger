services:
  db:
    image: postgres:18-alpine
    container_name: famledger-postgres
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_USER: ${POSTGRES_USER:-famledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be explicitly configured}
      POSTGRES_DB: ${POSTGRES_DB:-famledger}
    command: ["postgres", "-c", "log_timezone=${TZ:-Asia/Shanghai}"]
    volumes:
      - ./postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-famledger} -d ${POSTGRES_DB:-famledger}"]
      interval: 5s
      timeout: 5s
      retries: 5

  famledger:
    image: famledger:${FAMLEDGER_VERSION:-latest}
    container_name: famledger-app
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-famledger}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be explicitly configured}@db:5432/${POSTGRES_DB:-famledger}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be explicitly configured with high entropy}
      - FAMLEDGER_API_TOKEN=${FAMLEDGER_API_TOKEN:-}
      - FAMLEDGER_SERVICE_FAMILY_ID=${FAMLEDGER_SERVICE_FAMILY_ID:-}
      - ENV=${FAMLEDGER_ENV:-production}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - DATA_DIR=/app/data
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    ports:
      - "${FAMLEDGER_PORT:-8000}:8000"
    volumes:
      - ./famledger-data:/app/data
