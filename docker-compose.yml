services:
  db:
    image: postgres:18-alpine
    container_name: famledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-famledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-famledger_secret}
      POSTGRES_DB: ${POSTGRES_DB:-famledger}
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-famledger} -d ${POSTGRES_DB:-famledger}"]
      interval: 5s
      timeout: 5s
      retries: 5

  famledger:
    image: famledger:${FAMLEDGER_VERSION:-latest}
    container_name: famledger-app
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-famledger}:${POSTGRES_PASSWORD:-famledger_secret}@db:5432/${POSTGRES_DB:-famledger}
      - SECRET_KEY=${SECRET_KEY:-famledger_super_secret_key_change_me}
      - ENV=production
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - DATA_DIR=/app/data
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    ports:
      - "${FAMLEDGER_PORT:-8000}:8000"
    volumes:
      - famledger-data:/app/data

  famledger-bill:
    image: famledger-bill:${FAMLEDGER_VERSION:-latest}
    container_name: famledger-bill
    restart: unless-stopped
    build:
      context: ./services/bill
      dockerfile: backend/Dockerfile
    depends_on:
      - famledger
    environment:
      # 遵循严格边界契约：不直连数据库，只通过标准 API 通信
      - FAMLEDGER_API_URL=http://famledger:8000
      - FAMLEDGER_API_TOKEN=${FAMLEDGER_API_TOKEN:-}
      - GRAPH_CLIENT_ID=${GRAPH_CLIENT_ID:-}
      - GRAPH_CLIENT_SECRET=${GRAPH_CLIENT_SECRET:-}
      - GRAPH_TENANT_ID=${GRAPH_TENANT_ID:-common}
    volumes:
      - bill-data:/app/data

volumes:
  postgres-data:
  famledger-data:
  bill-data:

