<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>famledger</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg?v=blue-purple" />
    <link rel="alternate icon" href="/favicon.ico?v=blue-purple" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,700&family=Public+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)" />
  </head>
  <body class="bg-[#FAFAFA] dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100">
    <script>
      // Prevent flash of wrong theme before React hydrates
      (function() {
        var t;
        try { t = localStorage.getItem('theme'); } catch (_) {}
        var dark = t === 'dark' || (t !== 'light' && t !== 'dark' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        if (dark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = '#09090b';
        } else {
          document.documentElement.style.backgroundColor = '#FAFAFA';
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
